<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050506">
  <meta name="description" content="Slow Burn: an interactive, cinematic cigarette and smoke animation built with HTML, CSS and JavaScript.">
  <title>Slow Burn: an interactive smoke study</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23060607'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23ff6a1a'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%23ff6a1a' opacity='.25'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="scene" aria-label="A lit cigarette with smoke. Hold to draw, release to exhale, click the ash to flick it."></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <header class="top">
    <a class="brand" href="#" aria-label="Slow Burn">Slow Burn</a>
    <dl class="stats" aria-label="Current cigarette">
      <div><dt>Burned</dt><dd id="statBurn">0%</dd></div>
      <div><dt>Puffs</dt><dd id="statPuffs">0</dd></div>
      <div><dt>Lit for</dt><dd id="statTime">0:00</dd></div>
    </dl>
  </header>

  <section class="copy">
    <h1>Six minutes of slow&nbsp;burn.</h1>
    <p id="hint" class="hint">Hold anywhere to draw. Let go to exhale.</p>
  </section>

  <div class="drawbar" aria-hidden="true"><span id="drawFill"></span></div>

  <footer class="bottom">
    <p class="note">Smoking harms nearly every organ in the body. This page is an animation study, not encouragement.</p>
    <nav class="controls" aria-label="Controls">
      <button id="btnFlick" type="button" title="Flick the ash (F)">Flick ash</button>
      <button id="btnNew" type="button" title="Light another (N)">Light another</button>
      <button id="btnSound" type="button" aria-pressed="false" title="Toggle sound (M)">Sound off</button>
    </nav>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div class="curtain" aria-hidden="true"></div>
  <noscript><p class="noscript">This page needs JavaScript to draw the smoke.</p></noscript>

  <script src="script.js"></script>
</body>
</html>
